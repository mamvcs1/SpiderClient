name: Build Spider Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure stable APK signing
        if: ${{ secrets.SPIDER_KEYSTORE_BASE64 != '' }}
        env:
          SPIDER_KEYSTORE_BASE64: ${{ secrets.SPIDER_KEYSTORE_BASE64 }}
        run: |
          echo "$SPIDER_KEYSTORE_BASE64" | base64 --decode > spider-release.jks

      - name: Build APK
        env:
          SPIDER_KEYSTORE_PASSWORD: ${{ secrets.SPIDER_KEYSTORE_PASSWORD }}
          SPIDER_KEY_ALIAS: ${{ secrets.SPIDER_KEY_ALIAS }}
          SPIDER_KEY_PASSWORD: ${{ secrets.SPIDER_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClient-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
