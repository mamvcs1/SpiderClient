name: Build Spider Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download prebuilt libXray Android core
        run: |
          mkdir -p app/libs /tmp/libxray
          curl --fail --location --retry 3 https://github.com/XTLS/libXray/releases/download/v26.9.30/libxray-android.zip --output /tmp/libxray/libxray-android.zip
          unzip -q /tmp/libxray/libxray-android.zip -d /tmp/libxray/unpacked
          AAR="$(find /tmp/libxray/unpacked -type f -name 'libXray.aar' -print -quit)"
          test -n "$AAR"
          cp "$AAR" app/libs/libXray.aar
          ls -lh app/libs/libXray.aar

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClient-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
