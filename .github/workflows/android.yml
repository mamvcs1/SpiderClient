name: Build Spider Client APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Download pinned official libXray Android artifact
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/libxray-android.zip \
            https://github.com/XTLS/libXray/releases/download/v26.9.30/libxray-android.zip
          echo "394b59d147b37ab46003bd3f1d687ed3b2f637cabfc0cb863f179c5a87bddde3  /tmp/libxray-android.zip" | sha256sum --check
          mkdir -p /tmp/libxray-android app/libs
          unzip -q /tmp/libxray-android.zip -d /tmp/libxray-android
          AAR="$(find /tmp/libxray-android -type f -iname '*.aar' -print -quit)"
          if [ -z "$AAR" ]; then
            echo "::error::Pinned libXray release did not contain an Android AAR."
            find /tmp/libxray-android -maxdepth 3 -type f | head -100
            exit 1
          fi
          cp "$AAR" app/libs/libxray.aar
          test -s app/libs/libxray.aar
          echo "Selected Android artifact: $AAR"
          echo "AAR entries:"
          unzip -l app/libs/libxray.aar | head -60
          mkdir -p /tmp/libxray-aar-inspect
          unzip -p app/libs/libxray.aar classes.jar > /tmp/libxray-aar-inspect/classes.jar
          echo "Generated Java/Kotlin API classes:"
          jar tf /tmp/libxray-aar-inspect/classes.jar | grep -Ei 'libxray|dialer|controller' | head -100 || true
          echo "Pinned libXray Android AAR installed for Gradle."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure stable APK signing
        env:
          SPIDER_KEYSTORE_BASE64: ${{ secrets.SPIDER_KEYSTORE_BASE64 }}
          SPIDER_KEYSTORE_PASSWORD: ${{ secrets.SPIDER_KEYSTORE_PASSWORD }}
          SPIDER_KEY_ALIAS: ${{ secrets.SPIDER_KEY_ALIAS }}
          SPIDER_KEY_PASSWORD: ${{ secrets.SPIDER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          supplied=0
          for name in SPIDER_KEYSTORE_BASE64 SPIDER_KEYSTORE_PASSWORD SPIDER_KEY_ALIAS SPIDER_KEY_PASSWORD; do
            value="${!name:-}"
            if [ -n "$value" ]; then supplied=$((supplied + 1)); fi
          done

          if [ "$supplied" -eq 4 ]; then
            printf '%s' "$SPIDER_KEYSTORE_BASE64" | base64 --decode > spider-release.jks
            test -s spider-release.jks
            echo "SPIDER_STABLE_SIGNING=true" >> "$GITHUB_ENV"
            echo "Stable signing key decoded. Gradle will sign with the persistent key."
          elif [ "$supplied" -eq 0 ]; then
            echo "SPIDER_STABLE_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::Persistent signing is not configured. This APK will use the Android debug key and is not suitable for seamless updates over builds signed with another key."
          else
            echo "::error::Signing secrets are incomplete. Configure all four SPIDER_* signing secrets, or remove all four to build a debug-signed test APK."
            exit 1
          fi

      - name: Build APK
        env:
          SPIDER_KEYSTORE_PASSWORD: ${{ secrets.SPIDER_KEYSTORE_PASSWORD }}
          SPIDER_KEY_ALIAS: ${{ secrets.SPIDER_KEY_ALIAS }}
          SPIDER_KEY_PASSWORD: ${{ secrets.SPIDER_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Verify APK signature and report signing mode
        env:
          SPIDER_STABLE_SIGNING: ${{ env.SPIDER_STABLE_SIGNING }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          if [ "$SPIDER_STABLE_SIGNING" = "true" ]; then
            echo "Signature verification passed. APK was built with the configured persistent signing key."
          else
            echo "::warning::Signature is valid, but it uses the debug key. Persistent update compatibility is NOT confirmed."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpiderClient-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
